services:
  - type: web
    name: liars-bar-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: liars-bar-db
          property: connectionString
      - key: PG_SSL
        value: "true"
      - key: ADMIN_IDS
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true

databases:
  - name: liars-bar-db
    plan: basic-256mb
